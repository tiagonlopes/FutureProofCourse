[project]
name = "trial-conversion-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tiagolopes", email = "tiagonlopes@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.54",
    "xgboost>=3.2.0",
]

[project.scripts]
trial-conversion-model = "trial_conversion_model:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
]
